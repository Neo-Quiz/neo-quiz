<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src 'self'">
<title>Neo Quiz</title>
<style>
/* Les valeurs viennent de `installer/style-window.css` et `installer/style.css` :
   cette fenêtre doit être reconnue comme la même famille que l'installeur, pas
   comme une boîte de dialogue de plus. Elles sont RECOPIÉES et non importées —
   le principal charge ce fichier par `file://` depuis l'asar, sans chaîne de
   construction, et un `@import` vers `installer/` n'y résoudrait pas. */
:root, body { background: transparent; }
* { box-sizing: border-box; }
body {
	margin: 0;
	height: 100vh;
	overflow: hidden;
	font-family: "Segoe UI", system-ui, sans-serif;
	-webkit-user-select: none;
	cursor: default;
}
#app {
	position: relative;
	height: 100vh;
	border-radius: 10px;
	overflow: hidden;
	box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .07);
	background: linear-gradient(145deg, #07111f 0%, #07101d 58%, #060e1a 100%);
}
/* Le décor de l'installeur, cadré à droite comme chez lui. */
#decor {
	position: absolute;
	inset: 0;
	background: url("./fond.png") right center / cover no-repeat;
	opacity: .96;
}
#contenu {
	position: relative;
	height: 100%;
	display: flex;
	flex-direction: column;
	justify-content: flex-end;
	padding: 0 34px 30px;
	/* Le texte se détache du décor sans l'assombrir entièrement. */
	background: linear-gradient(180deg, rgba(4, 9, 18, 0) 38%, rgba(4, 9, 18, .82) 78%, rgba(4, 9, 18, .93) 100%);
}
h1 {
	margin: 0 0 7px;
	font-size: 21px;
	font-weight: 600;
	letter-spacing: -.01em;
	color: #eaf0ff;
}
p {
	margin: 0 0 20px;
	font-size: 13px;
	line-height: 1.45;
	color: rgba(207, 218, 239, .78);
}
/* Minimise: same glyph, size and colours as the bootstrapper's window controls
   (`src/ui/glyphes-fenetre.ts`, `installer/style-window.css`). The rest of the
   window drags. */
#app { -webkit-app-region: drag; }
#min {
	position: absolute;
	top: 12px;
	right: 20px;
	z-index: 1;
	display: inline-flex;
	align-items: center;
	justify-content: center;
	width: 24px;
	height: 24px;
	padding: 0;
	border: 0;
	border-radius: 6px;
	background: transparent;
	color: rgb(142, 149, 179);
	transition: color 100ms ease;
	-webkit-app-region: no-drag;
}
#min:hover, #min:focus-visible { color: rgb(198, 208, 245); }
/* Close: only once the update is known to have failed, left of Minimise. */
#fermer {
	position: absolute; top: 12px; right: 52px; z-index: 1;
	display: inline-flex; align-items: center; justify-content: center;
	width: 24px; height: 24px; padding: 0; border: 0; border-radius: 6px;
	background: transparent; color: rgb(142, 149, 179);
	-webkit-app-region: no-drag;
}
#fermer[hidden] { display: none; }
#fermer:hover, #fermer:focus-visible { color: rgb(198, 208, 245); }
#min:focus-visible { outline: 1px solid rgba(198, 208, 245, .5); outline-offset: -1px; }
#detail { margin-bottom: 14px; font-size: 12px; color: rgba(207, 218, 239, .55); }
#detail:empty { display: none; }
#statut { margin: 0 0 9px; font-size: 12.5px; color: rgba(207, 218, 239, .9); }
.barre {
	position: relative;
	height: 4px;
	overflow: hidden;
	border-radius: 999px;
	background: rgba(255, 255, 255, .085);
}
/* Indéterminée par CHOIX : le NSIS lancé par electron-updater n'écrit dans
   aucun dossier que cette fenêtre pourrait mesurer, et une barre qui resterait
   morte 70 % du temps mentirait plus qu'elle n'informerait. */
.barre i {
	position: absolute;
	display: block;
	left: 0;
	width: 42%;
	height: 100%;
	border-radius: inherit;
	background: linear-gradient(90deg, #5c72ff, #9db8ff);
	animation: glisse 1.15s ease-in-out infinite;
}
/* Determinate: the fill grows with the measured percentage, no sliding. */
.barre:not(.indeterminee) i {
	animation: none;
	width: 0;
	transition: width 150ms linear;
}
@keyframes glisse {
	0% { transform: translateX(-115%); }
	100% { transform: translateX(345%); }
}
@media (prefers-reduced-motion: reduce) {
	.barre i { animation-duration: 2.5s; }
}
</style>
</head>
<body>
<div id="app">
	<div id="decor"></div>
	<button id="fermer" type="button" title="Close" aria-label="Close" hidden><svg width="24" height="24" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M6.5 6.5l7 7M13.5 6.5l-7 7"/></svg></button>
	<button id="min" type="button" title="Minimize" aria-label="Minimize"><svg width="24" height="24" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M6.25 10H13.75"/></svg></button>
	<div id="contenu">
		<h1 id="titre">Updating Neo Quiz</h1>
		<p id="detail"></p>
		<p id="statut"></p>
		<div class="barre indeterminee" id="barre"><i id="rempli"></i></div>
	</div>
</div>
</body>
</html>
