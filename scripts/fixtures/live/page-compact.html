<!doctype html><html><head><meta charset='utf-8'>{{CSS}}</head><body>
<div class='task' id='task'></div>
<div class='row' id='pr'><span>Ma prédiction :</span><button>5</button><button>10</button><button>20</button></div>
<div class='mu' id='st'></div>
<div class='row'><button id='go'>Vérifier</button></div>
<div id='fb'></div>
<svg class='big' viewBox='0 0 680 230' role='img' aria-label='Composants reliés deux à deux'><g id='g'></g></svg>
<div class='row' id='nb'><span>Nombre de composants :</span></div>
<div id='say' class='mu'></div>
<script>(function(){
var n=5,pred=null,done=false,pb=[].slice.call(document.querySelectorAll('#pr button')),PV=[5,10,20],nbs=[];
var g=document.getElementById('g'),say=document.getElementById('say'),st=document.getElementById('st'),fb=document.getElementById('fb'),task=document.getElementById('task'),go=document.getElementById('go');
var T0='Prédis d’abord : 5 composants peuvent tous se parler deux à deux. Combien de liaisons possibles ? Choisis, puis Vérifier.';
function draw(){var P=[],h='',i,j;for(i=0;i<n;i++){var a=-Math.PI/2+2*Math.PI*i/n;P.push([(340+95*Math.cos(a)).toFixed(1),(115+95*Math.sin(a)).toFixed(1)])}
if(done){for(i=0;i<n;i++)for(j=i+1;j<n;j++)h+='<line x1='+P[i][0]+' y1='+P[i][1]+' x2='+P[j][0]+' y2='+P[j][1]+' stroke=var(--nq-muted) stroke-width=1.5 />'}
for(i=0;i<n;i++)h+='<circle cx='+P[i][0]+' cy='+P[i][1]+' r=16 fill=var(--nq-bg) stroke=var(--nq-accent) stroke-width=2 /><text x='+P[i][0]+' y='+(+P[i][1]+5)+' text-anchor=middle font-size=13>'+(i+1)+'</text>';
g.innerHTML=h;
nbs.forEach(function(b){b.className=(done&&+b.textContent===n?'on':'');b.disabled=!done});
if(done){var L=n*(n-1)/2;say.className='';say.textContent=n+' composants : chacun peut parler aux '+(n-1)+' autres, soit '+n+' × '+(n-1)+' / 2 = '+L+' liaisons possibles. Les liaisons grimpent bien plus vite que les composants : la complexité vient des relations.'}else{say.className='mu';say.textContent='Les liaisons apparaîtront après ta prédiction. Le nombre de composants se règle ensuite.'}}
for(var v=2;v<=8;v++){(function(v){var b=document.createElement('button');b.textContent=v;b.onclick=function(){if(!done)return;n=v;draw()};document.getElementById('nb').appendChild(b);nbs.push(b)})(v)}
pb.forEach(function(b,j){b.onclick=function(){if(done)return;pred=j;pb.forEach(function(c,k){c.className=k===j?'on':''});st.className='mu';st.textContent='Prédiction faite. Tu peux appuyer sur Vérifier.'}});
function reset(){done=false;pred=null;n=5;fb.innerHTML='';go.textContent='Vérifier';pb.forEach(function(c){c.className='';c.disabled=false});task.textContent=T0;st.className='mu';st.textContent='Encore à choisir : ta prédiction.';draw()}
go.onclick=function(){if(done){reset();return}
if(pred===null){st.className='ko';st.textContent='Il manque encore : ta prédiction.';return}
done=true;pb.forEach(function(c){c.disabled=true});
fb.innerHTML=PV[pred]===10?'<div class=ok>Juste : 5 × 4 / 2 = 10 liaisons possibles.</div>':'<div class=ko>Pas tout à fait : chaque composant peut parler aux 4 autres, soit 5 × 4 = 20 ; mais chaque liaison est alors comptée deux fois (A vers B, puis B vers A), donc 20 / 2 = 10.</div>';
go.textContent='Recommencer';st.className='mu';st.textContent='Prédiction verrouillée. Recommencer la débloque.';task.textContent='Maintenant, change le nombre de composants et regarde les liaisons se multiplier.';draw()};
reset();
})();</script></body></html>
