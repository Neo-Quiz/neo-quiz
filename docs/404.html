<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neo Quiz</title>
<script>
	// Deux anciennes formes d'adresse retombent ici et repartent vers la même
	// page, en une seule redirection : le préfixe `/neo-quiz/` (site servi
	// sous neo-quiz.github.io/neo-quiz/ jusqu'au 2026-09-27) et la version
	// française `/fr/`, retirée le même jour — le site n'est plus qu'en
	// anglais. Liens des installeurs déjà publiés, pages partagées.
	var chemin = location.pathname;
	var cible = chemin.replace(/^\/neo-quiz(?=\/|$)/, "").replace(/^\/fr(?=\/|$)/, "") || "/";
	if (cible !== chemin) location.replace(cible + location.search + location.hash);
</script>
<p>Page not found. <a href="/">Neo Quiz</a></p>
</html>
