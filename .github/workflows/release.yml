#          gh release upload "${{ needs.prepare.outputs.tag }}"             apps/windows/dist-installer/*.AppImage             apps/windows/dist-installer/*.deb             apps/windows/dist-installer/latest-linux.yml             apps/windows/dist-installer/latest-linux-arm64.yml             --clobber

#  # La page de téléchargement lit `docs/latest.json` (app) et
#  # `docs/latest-plugin.json` (greffon), servis par GitHub Pages, sans limite
#  # de requêtes, plutôt que l'API GitHub, qui refuse au-delà de 60 appels par
#  # heure et par adresse IP sans jeton : une promo derrière un même réseau
#  # l'atteignait en quelques minutes et la page perdait ses versions. Ce job
#  # tourne une fois les jobs du produit publié finis, écrit SEULEMENT le
#  # fichier du produit publié, et le pousse sur `main` (Pages se republie).
#  # Des jobs SKIPPED (`plugin` sur une app, ou l'inverse) sont normaux : un seul
#  # produit est construit par exécution.
  site:
    needs: [prepare, plugin, app-windows]
    if: ${{ !cancelled() && (github.event_name != 'workflow_dispatch' || github.event.inputs.publish == 'true') && needs.prepare.result == 'success' && needs.plugin.result != 'failure' && needs['app-windows'].result != 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Verify app release assets and promote latest
        if: needs.prepare.outputs.product == 'app'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          release_json=$(mktemp)
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" > "$release_json"
          jq -e '.draft == false and .prerelease == false' "$release_json" >/dev/null || {
            echo "::error::Release draft ou prerelease avant promotion."
            exit 1
          }
          for requis in \
            "NeoQuiz-${VERSION}.exe" \
            "neo-quiz-setup-${VERSION}.exe" \
            "neo-quiz-setup-${VERSION}.exe.blockmap" \
            "latest.yml"
          do
            jq -e --arg nom "$requis" '.assets[] | select(.name == $nom)' "$release_json" >/dev/null || {
              echo "::error::Asset obligatoire absent avant promotion latest : $requis"
              exit 1
            }
          done
          release_id=$(jq -er '.id' "$release_json")
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${release_id}" -f make_latest=true >/dev/null
          latest=$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq '.tag_name')
          [ "$latest" = "$TAG" ] || { echo "::error::Promotion latest échouée: $latest"; exit 1; }

      - name: Write latest.json from the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          PRODUCT: ${{ needs.prepare.outputs.product }}
        run: |
          if [ "$PRODUCT" = "app" ]; then fichier="docs/latest.json"; else fichier="docs/latest-plugin.json"; fi
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" \
            --jq '{tag_name, published_at, assets: [.assets[] | {name, size, browser_download_url}]}' \
            > "$fichier"
          cat "$fichier"
          echo "FICHIER=$fichier" >> "$GITHUB_ENV"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$FICHIER"
          git diff --cached --quiet && echo "$FICHIER inchangé" || git commit -m "Update $FICHIER for ${{ needs.prepare.outputs.tag }}"
          git push origin main

      # Ce push, fait avec le GITHUB_TOKEN, ne déclenche pas `site.yml` :
      # sans cet appel, neo-quiz.github.io garderait l'ancien latest.json.
      - name: Publish the site
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run site.yml --ref main
