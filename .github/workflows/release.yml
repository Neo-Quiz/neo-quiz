#      # Même copie sous nom fixe que pour l'installeur Windows : le lien
#      # permanent de la page de téléchargement vers l'AppImage vise
#      # releases/latest/download/neo-quiz.AppImage, jamais le nom versionné.
#      # Le nom versionné porte désormais l'architecture (deux AppImage), donc
