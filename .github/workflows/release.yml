name: Release Neo Quiz

# Deux PRODUITS INDÉPENDANTS, deux familles de tags, un seul flux de mise à
# jour :
#   - un tag NU `X.Y.Z` (sans préfixe, ex. `1.0.0`) PUBLIE le GREFFON
#     (main.js, styles.css, manifest.json) — c'est le numéro que lit
#     `obsidianmd/obsidian-releases` pour la liste communautaire. Les anciens
#     tags `vX.Y.Z` (avant la tâche 3 du chantier « greffon lecteur »)
#     publient encore le greffon, pour ne pas casser une release en cours.
#     Sa release est marquée `make_latest: false` : BRAT et Obsidian ne
#     lisent jamais « latest », ils lisent `manifest.json` sur `main` ;
#   - un tag `desktop-vX.Y.Z` PUBLIE L'APPLICATION (installeur Windows,
#     AppImage) — sa release n'est promue « latest » qu'APRÈS validation des
#     assets Windows + Linux, parce qu'electron-updater (fournisseur github,
#     sans `allowPrerelease`) ET le bootstrapper `NeoQuiz-X.Y.Z.exe` lisent
#     `/releases/latest` puis le `latest.yml` de CETTE release — par la
#     redirection `releases/latest/download/latest.yml` de github.com, jamais
#     par l'API REST (60 requêtes par heure et par IP sans jeton) ;
#   - `workflow_dispatch` RÉPÈTE par défaut sans publier, sur le produit choisi ;
#     avec `publish: true`, il publie par la MÊME chaîne. Cela permet une
#     automatisation sans recopier les jobs de build ni leur logique de signature.
# La signature Authenticode de l'installeur Windows (SignPath) est optionnelle,
# activée par la variable de dépôt `SIGNPATH_ORGANIZATION_ID` : tant qu'elle est
# absente, `main` reste publiable non signé.
on:
  push:
    tags:
      - 'v*'
      - 'desktop-v*'
      - '[0-9]*'
  workflow_dispatch:
    inputs:
      version:
        description: "Version à construire (sans le v), écrite dans le fichier de version le temps du build"
        required: true
        default: "0.0.0-repetition"
      product:
        description: "Produit à construire"
        required: true
        type: choice
        options:
          - app
          - plugin
        default: "app"
      publish:
        description: "Publier réellement la release demandée"
        required: true
        type: boolean
        default: false

jobs:
  # Résout version / tag / produit une seule fois et crée la release AVANT les
  # builds, mais JAMAIS comme `latest`. Les jobs peuvent ainsi y attacher leurs
  # fichiers sans exposer au bootstrapper une release encore incomplète.
  # Le job `site` ne promeut l'application qu'après succès Windows + Linux et
  # validation des assets indispensables.
  prepare:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      product: ${{ steps.version.outputs.product }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # `desktop-v*` → app, `v*` → plugin. En répétition, les deux entrées
      # choisissent directement. Les entrées passent par l'environnement,
      # jamais interpolées dans le script : interpolées, une valeur saisie
      # serait exécutée comme du shell.
      - name: Resolve version, tag and product
        id: version
        shell: bash
        env:
          VERSION_SAISIE: ${{ github.event.inputs.version }}
          PRODUIT_SAISI: ${{ github.event.inputs.product }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            produit="$PRODUIT_SAISI"
            # Tag NU pour le greffon depuis la tâche 3 (chantier « greffon
            # lecteur ») : pas de préfixe, `obsidianmd/obsidian-releases` lit
            # le numéro tel quel.
            if [ "$produit" = "app" ]; then prefixe="desktop-v"; else prefixe=""; fi
            echo "version=$VERSION_SAISIE" >> "$GITHUB_OUTPUT"
            echo "tag=$prefixe$VERSION_SAISIE" >> "$GITHUB_OUTPUT"
            echo "product=$produit" >> "$GITHUB_OUTPUT"
          else
            tag="${GITHUB_REF#refs/tags/}"
            case "$tag" in
              desktop-v*)
                echo "product=app" >> "$GITHUB_OUTPUT"
                echo "version=${tag#desktop-v}" >> "$GITHUB_OUTPUT"
                ;;
              # Tag NU (« 1.0.0 »), la forme du greffon depuis la tâche 3.
              # Avant v*) : un tag numérique ne commence jamais par une lettre,
              # donc l'ordre n'a pas d'incidence, mais la même règle que
              # `release.yml` en tête l'énonce dans cet ordre.
              [0-9]*)
                echo "product=plugin" >> "$GITHUB_OUTPUT"
                echo "version=$tag" >> "$GITHUB_OUTPUT"
                ;;
              # Anciens tags du greffon (avant la tâche 3), gardés pour ne pas
              # casser une release déjà en cours.
              v*)
                echo "product=plugin" >> "$GITHUB_OUTPUT"
                echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
                ;;
              *)
                echo "Tag inattendu : $tag" >&2
                exit 1
                ;;
            esac
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20

      # Les NOTES de la release viennent de CHANGELOG.md (tâche 2 du chantier
      # « utilisable par n'importe qui ») : une version de l'application sans
      # section dans le fichier ÉCHOUE ICI, avant qu'une release n'existe.
      # Le greffon n'a pas de changelog : corps vide. Même garde que « Create
      # Release » juste en dessous : une répétition `workflow_dispatch` porte
      # une version placeholder qui n'a aucune section dans le CHANGELOG, et
      # elle ne publie rien.
      - name: Release notes
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.publish == 'true'
        shell: bash
        run: |
          if [ "${{ steps.version.outputs.product }}" = "app" ]; then
            node scripts/changelog.mjs extract "${{ steps.version.outputs.version }}" > RELEASE_NOTES.md
          else
            : > RELEASE_NOTES.md
          fi
          cat RELEASE_NOTES.md

      # La release existe avant les builds pour recevoir leurs assets, mais
      # reste NON latest. `/releases/latest` est consommé par le bootstrapper :
      # il ne doit jamais pointer vers une release dont le NSIS ou le
      # `latest.yml` manque encore.
      - name: Create Release
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "${{ steps.version.outputs.tag }}"
          name: "${{ steps.version.outputs.tag }}"
          target_commitish: ${{ github.sha }}
          body_path: RELEASE_NOTES.md
          # Pré-version dès que le tag porte un suffixe semver (v2.0.0-beta,
          # -rc.1, -alpha…) : c'est la définition même de semver, donc une
          # future v2.1.0 sans suffixe sortira en release normale sans qu'on
          # ait à repasser ici.
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}
          make_latest: "false"

  plugin:
    needs: prepare
    if: needs.prepare.outputs.product == 'plugin'
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      # UNE SEULE façon d'écrire la version : le script du dépôt, jamais un
      # `node -e` inline qui divergerait de lui.
      # `set-version.mjs` SORT EN 1 quand le manifeste porte déjà le numéro
      # (« Rien à changer ») : c'est le cas normal d'un tag posé juste après
      # le commit « Version X ». Le mode répétition ne le voyait pas, il change
      # toujours le numéro. D'où le test avant l'appel.
      - name: Update plugin version
        shell: bash
        env:
          VERSION_VOULUE: ${{ needs.prepare.outputs.version }}
        run: |
          actuelle=$(node -p "require('./src/assets/manifest.json').version")
          if [ "$actuelle" != "$VERSION_VOULUE" ]; then node scripts/set-version.mjs --plugin "$VERSION_VOULUE"; fi

      - name: Type check
        run: npm run check

      # Le build passe par esbuild.config.mjs : une config esbuild dupliquée ici
      # diverge en silence (les loaders de fontes MathLive y ont manqué).
      # Hors Windows, aucun vault n'est détecté : la sortie reste dans dist/.
      - name: Build
        run: npm run build

      - name: Collect release files
        run: |
          mkdir -p release
          cp dist/main.js dist/styles.css release/
          cp src/assets/manifest.json release/manifest.json
          ls -lh release/

      - name: Upload plugin (répétition)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.publish != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: neo-quiz-plugin
          path: release/*
          if-no-files-found: error

      # La release existe déjà (job `prepare`) : ce step ne fait que lui
      # attacher les fichiers. `make_latest` est RÉPÉTÉ ici parce que
      # l'action renvoie un PATCH à l'API GitHub dont le défaut documenté
      # est `true` : omis, une release du greffon redeviendrait « latest »
      # et electron-updater ne trouverait plus d'installeur.
      - name: Attach plugin to release
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "${{ needs.prepare.outputs.tag }}"
          make_latest: "false"
          files: |
            release/main.js
            release/manifest.json
            release/styles.css

  # L'application, deux paquets, deux runners. `needs: prepare` : la release
  # existe déjà quand ils y attachent leurs fichiers. Un échec de l'un des
  # deux n'annule pas l'autre.
  app-windows:
    needs: prepare
    if: needs.prepare.outputs.product == 'app'
    runs-on: windows-latest
    # `actions: read` en plus de `contents: write` : un bloc `permissions`
    # explicite met tout le reste à `none`, et l'action SignPath a besoin de
    # lire l'artefact de workflow qu'elle signe (`github-artifact-id`).
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
      - name: Install dependencies (racine)
        run: npm ci
      - name: Install dependencies (apps/windows)
        run: npm ci
        working-directory: apps/windows
      # Même garde que le job `plugin` : « Rien à changer » sort en 1.
      - name: Update app version
        shell: bash
        env:
          VERSION_VOULUE: ${{ needs.prepare.outputs.version }}
        run: |
          actuelle=$(node -p "require('./apps/windows/package.json').version")
          if [ "$actuelle" != "$VERSION_VOULUE" ]; then node scripts/set-version.mjs "$VERSION_VOULUE"; fi
      - name: Build and package (NSIS)
        run: npm run pack:win
        working-directory: apps/windows

      # Le pourcentage d'installation du bootstrapper compte les octets écrits
      # dans le dossier d'installation contre CETTE taille : `win-unpacked`
      # existe encore, avant que SignPath ne remplace l'exe non signé.
      - name: Write installedSize into latest.yml
        run: node scripts/write-installed-size.mjs

      # Le bootstrapper est le SEUL exécutable que le site remet directement
      # à l'utilisateur. Le NSIS versionné reste publié, mais comme moteur
      # silencieux téléchargé par le bootstrapper et comme paquet de mise à
      # jour lu par electron-updater.
      - name: Build bootstrapper (portable Electron)
        run: npm run pack:installer
        working-directory: apps/windows

      # Les étapes SignPath ci-dessous sont sautées tant que
      # `vars.SIGNPATH_ORGANIZATION_ID` n'est pas posée : `main` reste
      # publiable non signé pendant que la demande de certificat est en cours.
      - name: Upload unsigned installer for SignPath
        id: unsigned
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: actions/upload-artifact@v4
        with:
          name: neo-quiz-windows-unsigned
          # L'action SignPath ne signe qu'un artefact de WORKFLOW (c'est ainsi
          # qu'elle prouve que GitHub a construit le fichier), et l'exe SEUL :
          # la config d'artefact (.signpath/artifact-configurations/initial.xml)
          # n'attend que lui. Le bootstrapper demandera une extension séparée
          # de cette configuration dans le portail SignPath avant de pouvoir
          # être signé par le même certificat.
          path: apps/windows/dist-installer/neo-quiz-setup-*.exe
          if-no-files-found: error

      - name: Submit signing request
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          # Une répétition reçoit le certificat de test ; une vraie publication,
          # même déclenchée par workflow_dispatch, reçoit la politique release.
          signing-policy-slug: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.publish != 'true' && 'test-signing' || 'release-signing' }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: apps/windows/signed
          parameters: |
            version: ${{ toJSON(needs.prepare.outputs.version) }}

      # Sans le script suivant, `latest.yml` et le blockmap continueraient de
      # décrire l'exe NON signé : electron-updater rejetterait la mise à jour
      # chez chaque utilisateur (sha512 mismatch).
      - name: Replace the installer with the signed one
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        shell: bash
        run: |
          ls apps/windows/signed/
          cp apps/windows/signed/neo-quiz-setup-*.exe apps/windows/dist-installer/
          node scripts/update-info-after-signing.mjs

      - name: Verify the signature
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        shell: pwsh
        env:
          EVENEMENT: ${{ github.event_name }}
          PUBLIER: ${{ github.event.inputs.publish }}
        run: |
          $nomExe = (Select-String -Path apps/windows/dist-installer/latest.yml -Pattern '^path:\s*(.+)$').Matches[0].Groups[1].Value.Trim()
          $cheminExe = "apps/windows/dist-installer/$nomExe"
          $sig = Get-AuthenticodeSignature -LiteralPath $cheminExe
          Write-Host "Status : $($sig.Status)"
          Write-Host "Subject du certificat : $($sig.SignerCertificate.Subject)"

          # Le CN seul, tel qu'electron-updater le compare (`subject.get("CN")`)
          # à `publisherName` : c'est CETTE valeur qu'il faut recopier dans
          # `win.signtoolOptions.publisherName`, pas le Subject entier.
          $cn = $sig.SignerCertificate.GetNameInfo([System.Security.Cryptography.X509Certificates.X509NameType]::SimpleName, $false)
          Write-Host "CN du certificat (valeur pour publisherName) : $cn"

          # electron-builder écrit `publisherName` en LISTE YAML
          # (`publisherName:` puis `  - Nom`), jamais sur une ligne : la regex
          # accepte les deux formes.
          $cheminAppUpdate = "apps/windows/dist-installer/win-unpacked/resources/app-update.yml"
          $publisherName = $null
          if (Test-Path $cheminAppUpdate) {
            $m = [regex]::Match((Get-Content $cheminAppUpdate -Raw), '(?ms)^publisherName:\s*(?:-\s*)?(\S[^\r\n]*)')
            if ($m.Success) { $publisherName = $m.Groups[1].Value.Trim().Trim("'", '"') }
          }
          Write-Host "publisherName d'app-update.yml : $(if ($publisherName) { $publisherName } else { '(absent)' })"

          if ($env:EVENEMENT -ne 'workflow_dispatch' -or $env:PUBLIER -eq 'true') {
            # Certificat SignPath Foundation, approuvé par Windows : la
            # signature doit être valide pour toute vraie publication.
            if ($sig.Status -ne 'Valid') {
              Write-Error "Signature invalide : $($sig.Status)"
              exit 1
            }
            # Égalité STRICTE : une sous-chaîne qui « ressemble » laisserait
            # passer un publisherName qu'electron-updater refuserait.
            if ($publisherName -and $cn -cne $publisherName) {
              Write-Error "publisherName ($publisherName) ne correspond pas au CN du certificat ($cn)"
              exit 1
            }
          } else {
            # Certificat de test (répétition), non approuvé par Windows :
            # on affiche seulement, sans exiger 'Valid'.
            Write-Host "Répétition : signature affichée sans être exigée valide."
          }

      # Déplacé après les étapes SignPath : ce contrôle doit voir le
      # latest.yml et le blockmap RECALCULÉS après signature, pas ceux
      # d'electron-builder sur l'exe non signé.
      - name: Package config and contents
        run: npm run check:package

      - name: Upload Windows package (répétition)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.publish != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: neo-quiz-windows-setup
          path: |
            apps/windows/dist-installer/*.exe
            apps/windows/dist-installer/*.exe.blockmap
            apps/windows/dist-installer/latest.yml
            apps/windows/dist-installer-bootstrapper/NeoQuiz-*.exe
          if-no-files-found: error

      # `NeoQuiz-X.Y.Z.exe` (le bootstrapper, nommé par `artifactName` dans
      # `installer/electron-builder.config.mjs`) est l'entrée PUBLIQUE : un
      # seul fichier, versionné comme `Obsidian-1.13.7.exe`, la langue étant
      # celle de Windows. Le NSIS n'a plus d'alias fixe : seul son nom
      # VERSIONNÉ est attaché, car le bootstrapper le résout par `latest.yml`
      # et electron-updater l'y lit aussi. Cela empêche le site de contourner
      # le bootstrapper.
      # `gh release upload`, et NON softprops/action-gh-release : ce tag
      # FLOTTANT `@v2` a changé entre 1.2.0 (verte, 21h56) et 1.2.1, et depuis,
      # tout envoi de gros paquet meurt — « Error creating asset temp dir »
      # côté Windows, « Error saving asset » puis « Headers Timeout Error »
      # après 17 minutes côté Linux (2026-09-17, quatre runs). `gh` est déjà
      # installé sur les runners, envoie les fichiers l'un après l'autre et ne
      # peut pas changer sous nos pieds. L'attachement ne promeut JAMAIS une
      # release incomplète : le job `site` la rendra latest après succès
      # Windows + Linux et validation de tous les assets indispensables.
      - name: Attach Windows package to release
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.publish == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload "${{ needs.prepare.outputs.tag }}"             apps/windows/dist-installer/*.exe             apps/windows/dist-installer/*.exe.blockmap             apps/windows/dist-installer/latest.yml             apps/windows/dist-installer-bootstrapper/NeoQuiz-*.exe             --clobber

  # ── Linux, EN SOMMEIL (choix d'Ahmed, 2026-09-17) ──────────────────
  # Il n'utilise l'application que sous Windows, et ce job allongeait chaque
  # release de plusieurs minutes pour des paquets que personne ne télécharge.
  # Il est CONSERVÉ EN COMMENTAIRE, pas supprimé : pour le réveiller, le
  # décommenter, remettre `app-linux` dans les `needs` et la condition du job
  # `site`, les quatre assets Linux dans la liste des requis, et la carte
  # Linux du site. Les versions déjà publiées gardent leurs paquets Linux.
