name: CI

on:
  push:
    branches:
      - '**'
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      # LE FORMAT LEARN / PRACTICE : un Practice sans explication, une
      # tranche Learn incomplète, un slice qui ne pointe nulle part — signalés.
      - name: Learn and Practice format
        run: npm run check:quiz-format

      - name: check:code-exercise
        run: npm run check:code-exercise

      # LE PROMPT DE CHAQUE MODE DÉCRIT CE QUE LE CONTRÔLE EXIGE : un champ tu
      # dans le prompt n'est jamais produit (explain, le 2026-09-23).
      - name: Learn and Practice prompts
        run: npm run check:prompt

      # LA CATÉGORIE D'UN QUIZ (Python, C, réseau…) : déduite des pièces
      # jointes, puis du dossier, puis de la demande ; la lettre C d'une
      # phrase n'est pas le langage C, une égalité ne tranche rien.
      - name: Quiz category detection
        run: npm run check:categorie

      # THE LIVE TRANSCRIPT of a generation: a CLI line cut by the pipe is
      # read once, a non-JSON line never breaks the stream, and the final
      # result of a Claude stream-json output is always found.
      - name: Generation transcript decoding
        run: npm run check:transcript

      # THE "EXPLAIN" PROMPT of a question: its choices, its expected answer
      # and the learner's go with it, never a raw placeholder.
      - name: Explain prompt of a question
        run: npm run check:explain

      # LE MARKDOWN DE BLOC ET DE LIGNE d'un texte de quiz (paragraphes,
      # listes, tableaux, blocs de code colorés, images, liens) : gras et
      # italique interprétés, une formule LaTeX ou un chemin Windows laissés
      # intacts, jamais une balise HTML tapée à la main qui s'exécute.
      - name: Quiz markdown rendering
        run: npm run check:md

      # LA COLORATION SYNTAXIQUE D'UN BLOC DE CODE : aucun effet de bord sur
      # le `Prism` de l'hôte (Obsidian a le sien), et une durée bornée même
      # sur des motifs RÉPÉTÉS hostiles (pas seulement aléatoires) — une
      # re-revue a trouvé un motif qui prenait plus de 400 ms sur du bash
      # avec le premier plafond.
      - name: Code block syntax highlighting
        run: npm run check:code-highlight

      # LE BOUTON « EXÉCUTER » D'UN BLOC PYTHON : la sortie d'un programme
      # (un quiz partagé est hostile) n'apparaît jamais comme élément HTML
      # sous `.quiz-code-output`, seulement comme texte (`textContent`).
      - name: Python run button output never interpreted
        run: npm run check:code-run

      # DU MARKDOWN PARTOUT : un quiz en HTML s'ouvre en markdown dans
      # l'éditeur, seulement quand c'est SANS PERTE — sinon le HTML reste.
      - name: HTML to markdown conversion
        run: npm run check:html-markdown

      # UNE RÉPONSE NUMÉRIQUE TAPÉE DANS L'ÉDITEUR D'ÉQUATIONS arrive en LaTeX
      # (« 1{,}5 », « \frac{3}{4} ») : ramenée à un nombre, jamais juste à tort.
      - name: Numeric answers typed in LaTeX
        run: npm run check:numeric

      # THE RULES OF CODE EXECUTION: which block languages run, which question
      # is a program-output question, when `runInLastHint` is valid, and when ▶
      # shows on a block. Pure rules, shared by engine, format check and editor.
      - name: Code execution rules
        run: npm run check:code-languages

      # The language catalogue of code blocks: one entry per tag, no inherited
      # key read as a language, a logo or icon for each, inert SVG logos,
      # every tag coloured, and the badge only in the displayed render.
      - name: Code language catalogue
        run: npm run check:code-catalogue

      # UNE RÉPONSE COPIÉE D'UN SITE, dans tous ses états : fence, prose,
      # LaTeX, virgule oubliée, faux titres de section (Gemini, 2026-09-24).
      # LE COURS AU-DESSUS D'UNE QUESTION : caché avant la lecture et pendant
      # un rappel, ouvert au-dessus d'une « à expliquer avec tes mots ».
      - name: Passage above a question
        run: npm run check:passage

      - name: Web channel responses
        run: npm run check:web-channel

      # LE CLIQUET DE LA FRONTIÈRE D'HÔTE. Le contrat `src/host/types.ts` dit
      # que c'est ce contrôle, et non la discipline, qui tient la frontière :
      # tant qu'il n'était lancé qu'à la main, c'était encore la discipline.
      # Il coûte moins d'une seconde et ne lit que des fichiers du dépôt —
      # ni vault, ni chaîne Rust, ni Obsidian installé.
      - name: Host boundary ratchet
        run: npm run check:host

      # THE ANDROID BRIDGE, WITHOUT A DEVICE: every channel the shim sends has a
      # Kotlin entry (and the other way round), every `Pont` method exists in the
      # shim, and the executable-extension list `systeme.ouvrir` refuses equals the
      # Windows one. Reads repository files only.
      - name: Android bridge channels
        run: npm run check:android-pont

      # LE NOYAU DES VIDÉOS YouTube : la règle de la piste (manuelle dans la
      # langue de la vidéo, sinon automatique `-orig`, JAMAIS une piste
      # traduite) ne se voit dans aucun typecheck — la prendre, c'est joindre
      # au prompt une transcription qui n'est pas celle de la vidéo. Charge le
      # code réel et des fixtures yt-dlp réduites ; pur, lecture seule.
      - name: YouTube videos kernel
        run: npm run check:video

      # TROUVER ET LANCER YT-DLP CÔTÉ PRINCIPAL : la copie gérée avant le
      # PATH étendu, l'identifiant revalidé avant tout lancement, les
      # arguments des deux appels figés, l'arbre tué au délai, la
      # miniature jamais bloquante. Sur un faux yt-dlp de la fixture, dans
      # un dossier temporaire — de vrais process, rien d'installé.
      - name: yt-dlp main process
        run: npm run check:electron-video

      # THE C/C++ LANGUAGE PACK installer: a download that does not match
      # its pin (a valid but different pack, a flipped byte, a truncated
      # body) never installed and leaves nothing on disk; a redirect off
      # the host list never followed; an archive entry that would escape
      # the pack directory refused. On an injected transport, never the
      # network.
      - name: Language pack installer
        run: npm run check:electron-langages

      # The Python package proxy: a package file the pack lock does not
      # name never reaches the network, bytes that do not match the lock
      # (or the digest PyPI announced) are never served or cached, only
      # pure wheels pass, and the download budget stops. Injected transport.
      - name: Python package proxy
        run: npm run check:code-packages

      # Le contenu d'un dossier (documents, notes, `Liens.md`) et ce que
      # « Créer avec l'IA » joint depuis un dossier : pur, lecture seule.
      - name: Folder contents and links grammar
        run: npm run check:folder-contents

      # L'aperçu d'une note : un rendu par blocs qui n'écrit que ses propres
      # balises. Le premier cas est la sécurité — une note reçue ne s'exécute
      # jamais.
      - name: Markdown preview rendering
        run: npm run check:md-preview

      # Même nature : lecture seule sur `src/assets/css` et le thème de l'app.
      # Une variable CSS oubliée ne produit AUCUNE erreur, juste un texte
      # invisible — donc elle se mesure, elle ne se relit pas.
      - name: App theme completeness
        run: npm run check:theme

      # L'entrée d'une vue se TERMINE : `markViewEnter` n'attend que les
      # animations qui peuvent finir, et aucune animation d'entrée ne garde
      # ses propriétés après sa fin. Sans quoi le survol d'une carte saute au
      # lieu de glisser — et ça ne se voit qu'à la souris, jamais dans un
      # typecheck. Pur, lecture seule sur `src/`.
      - name: View enter terminates
        run: npm run check:view-enter

      # LE VIEWPORT D'UN QUIZ N'EST JAMAIS DÉFILABLE : un `overflow: hidden`
      # s'y faisait défiler par un focus et laissait une page blanche.
      - name: Quiz viewport is clipped
        run: npm run check:viewport-clip

      # LE PARTAGE : la fenêtre donne au principal un nom et des octets. Un
      # nom qui serait un chemin, une extension hors liste ou une apostrophe
      # qui fermerait la chaîne du script PowerShell sont refusés ou cités.
      - name: Share names and script quoting
        run: npm run check:partage

      # MOODLE IN THE APP: the login token never leaves the main process, every
      # request and redirect stays on the configured site, paths cannot escape,
      # and the passport and host checks are replayed on mutants.
      - name: Moodle sync
        run: npm run check:moodle


      # LA PHOTO DE SESSION d'un quiz : reprendre là où on s'était arrêté sans
      # perdre de réponses, même si le quiz a changé entre deux sessions.
      - name: Quiz session snapshot
        run: npm run check:session

      # THE TEST SETUP: Exam mode is on exactly when hints are off and a time
      # limit is set; a duration is always within [1, 300]; a malformed
      # remembered value falls back to the file's default.
      - name: Test setup rules
        run: npm run check:test-setup

      # THE LEARN RETRY LOOP: a missed question comes back after two other
      # checks or at the end of its step, never at once, three retries at most.
      - name: Learn retry loop
        run: npm run check:learn-loop

      # L'HISTORIQUE DES TENTATIVES : meilleur score dérivé, anciens scores
      # lus sans perte, suppression et annulation symétriques.
      - name: Stats attempts
        run: npm run check:stats

      # SWIPE between pages: thresholds, edge zones, scrollers, fields, modals.
      - name: Swipe
        run: npm run check:swipe

      # THE OVERSCROLL STRETCH: the damped pull, the edge test, and which boxes can stretch.
      - name: Overscroll stretch
        run: npm run check:overscroll

      # EXAMS AND ATTEMPTS PER DEVICE in the synced folder: the merge (newest
      # edit, tombstones, delete-before-add), the one-time migration, conflict
      # copies, and a folder move between roots.
      - name: Shared state
        run: npm run check:shared-state

      # THE FOLDER LIST: picked folders persist, the default one stays first.
      - name: Folders
        run: npm run check:folders

      # THE EMBEDDED SYNCTHING: only the neo-quiz folder, only from a paired
      # device, device ids validated, launch arguments with nothing but their
      # parameters, every REST call carrying the key. (The real-binary section
      # runs on Windows after `npm run fetch:syncthing`.)
      - name: Embedded Syncthing rules
        run: npm run check:electron-syncthing

      # THE HOME PAGE: a folder's tasks in order (review, Learn, Test),
      # mastered quizzes left out, folders by nearest exam then latest work,
      # the week from Monday, local midnights across daylight saving.
      - name: Home tasks
        run: npm run check:home

      # LES CHANGEMENTS D'ÉCRAN pendant la transition de lancement d'un quiz :
      # un double clic ne lance rien deux fois, un retour cliqué pendant la
      # montée part à la fin au lieu d'être avalé, la fin ne se joue qu'une
      # fois, et une fenêtre masquée pose l'état final sans animer.
      - name: Screen transition
        run: npm run check:transition

      # Les gestes d'édition d'une question, partagés par le formulaire et
      # l'édition dans le rendu : jamais une question sans bonne réponse,
      # jamais deux emplacements d'un classement sur le même élément.
      - name: Gestes d'édition d'une question
        run: npm run check:gestes

      # LE GLOSSAIRE D'UN QUIZ : un terme jamais apparié dans un mot plus long
      # qui le contient ni au travers d'un accent, jamais coupé dans une
      # formule, jamais deux fois pour la même entrée — la plus longue gagne
      # sur un chevauchement. Reconnaît aussi qu'un objet sans énoncé porteur
      # d'un `glossary` est la configuration du bloc, comme `source`.
      - name: Quiz glossary terms
        run: npm run check:termes

      # LA FILE DE GÉNÉRATION : une génération à la fois, dans l'ordre
      # d'envoi ; la suivante n'attend pas qu'on le lui dise, mais elle attend
      # que le processus annulé ait rendu le verrou de son CLI.
      - name: Generation queue
        run: npm run check:file-generation
      - name: Conversation context
        run: npm run check:conversation-context
      # THE CHAT RECORD: the shape chats are kept in; a corrupt value never
      # breaks the page, a request saved again loses and doubles nothing,
      # a tombstone survives the bound.
      - name: Chat record
        run: npm run check:chat-record
      - name: Chat archives and the /exam prompts
        run: npm run check:chat-archives
      # WHICH KIND A GENERATE REQUEST WANTS: keywords decide only when they
      # say one kind plainly, the model's answer is parsed strictly, and its
      # prompt carries document names, never content.
      - name: Generation kind
        run: npm run check:generation-kind
      # THE DESTINATION FOLDERS: most recently changed first, and the ones a
      # request's words match suggested (accents ignored, name before titles).
      - name: Folder suggestions
        run: npm run check:folder-suggest
      # THE CHAT STORE: a full or refused storage never loses the chat on
      # screen, a deleted chat stays deleted, the legacy archive is imported
      # once, and a reload keeps the active chat.
      - name: Chat store
        run: npm run check:chat-store
      # THE CHATS, pure cores: lines grouped into requests (one bubble per
      # send), reconciled into records without erasing an answer, the thread
      # and the list derived from record + live lines, the follow-up context.
      - name: Chat thread and list
        run: npm run check:chat-thread

      # A generation survives a reload of its page: its CLI is detached, not
      # killed, and attached again by the same window only; unclaimed, it is
      # stopped after the delay; a closed window stops its runs at once.
      - name: Resumable CLI runs
        run: npm run check:cli-resume

      # Le bootstrapper lance l'installeur NSIS en silence : l'ordre des
      # arguments et la sélection du paquet ne peuvent donc pas être relus à
      # l'écran. Ce contrôle charge le noyau réellement appelé par l'installeur.
      - name: Installer bootstrapper invariants
        run: npm run check:installer

      # Le REFLET de l'installation, dont dépend qu'une mise à jour aboutisse :
      # des liens durs sur un vrai dossier temporaire. Le risque tenu n'est pas
      # qu'une fenêtre soit laide, c'est qu'un processus lancé depuis le dossier
      # d'installation EMPÊCHE NSIS de le renommer. Pur Node, lecture seule sur
      # le dépôt, comme les autres contrôles de ce job.
      - name: Update window mirror
        run: npm run check:fenetre-maj

      # Block writing: the exported quiz block reads back identical.
      - name: Quiz block export
        run: npm run check:export

      # The only path that rewrites a note: compare-and-swap, line endings, fences.
      - name: Quiz note writing
        run: npm run check:quiz-io

      # Unrendered markdown markers in sample notes.
      - name: Unrendered markdown markers
        run: npm run check:markers

      # Catalogue keys: a shifted key would lose review history.
      - name: Quiz catalogue scanner
        run: npm run check:scanner

      # The pure scheduler core stays pure and correct.
      - name: Review scheduler core
        run: npm run check:scheduler

      # Video tile rules.
      - name: Video tile
        run: npm run check:video-tile

      # Text search rules.
      - name: Text search
        run: npm run check:text-search

      # Ported dashboard pages never regain Obsidian DOM extensions.
      - name: Dashboard DOM ratchet
        run: npm run check:dashboard-dom

      # Shared LaTeX segmentation ($ before $).
      - name: Math segmentation
        run: npm run check:math-render

      # Review journal location and migration.
      - name: Review log location
        run: npm run check:review-log

      # Rename matching between hosts is by proof, not resemblance.
      - name: Rename matching
        run: npm run check:rename-match

      # Engine wiring to the review journal and the timed Test.
      - name: Engine review wiring
        run: npm run check:engine-review

      # EVERY check:* SCRIPT RUNS HERE: a check that is not in this file can go red unseen.
      - name: CI covers every check
        run: npm run check:ci-coverage

      - name: Changelog
        run: npm run check:changelog

  # Le paquet Linux de l'application : AppImage exige un runner Linux, ce
  # que le poste de développement (Windows) ne peut pas fournir.
  #
  # DEUX `npm ci`, DANS CET ORDRE (Ruling 22). Le code partagé qu'`apps/windows`
  # compile importe des paquets déclarés uniquement dans le `package.json` de
  # la RACINE (`mathlive`, `json5`) : un `npm ci` limité à `apps/windows`
  # laisse ces imports introuvables (125 erreurs `tsc` sans le premier
  # `npm ci`, 0 avec, mesuré dans un worktree sans `node_modules` racine).
  #
  # Plus de `continue-on-error` : il masquait un job qui n'a JAMAIS été vert
  # (chaque run échouait sur `executableName` dérivé de `@neo-quiz/windows`,
  # réparé par `executableName: "neo-quiz"` dans la config, tranche 6).
  app-linux-package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies (racine)
        run: npm ci

      - name: Install dependencies (apps/windows)
        run: npm ci
        working-directory: apps/windows

      # Le texte d'un PDF, par le VRAI moteur (`pdfjs-dist`, déclaré dans
      # `apps/windows`, d'où sa place APRÈS ce second `npm ci`). Les PDF sont
      # écrits par le script : ni fichier binaire au dépôt, ni vault.
      - name: PDF text extraction
        run: npm run check:pdf

      # A COURSE'S MODES on one card (Learn, Practice, Exam; at most one quiz
      # per mode), the dashboard's module editing and folder axis. Here and
      # not in the first job: it checks the folder icons against `lucide`,
      # declared in `apps/windows` only, installed by the second `npm ci`.
      - name: Course grouping and module editing
        run: npm run check:module-edit

      # The Android copy of the C/C++ pack pin equals PACK_C.
      - name: Android code pack pin
        run: npm run check:android-code-pack

      # Review store wiring across hosts.
      - name: Review store
        run: npm run check:review-store

      # Moving a quiz between folders.
      - name: Move quiz
        run: npm run check:move-quiz

      # The debounced watcher and index never lose a note history on rename.
      - name: Electron file index
        run: npm run check:electron-index

      # Network allow-list of the main process.
      - name: Electron network rules
        run: npm run check:electron-reseau

      # Electron paste handling.
      - name: Electron paste
        run: npm run check:electron-collage

      # The pure auto-update core.
      - name: Auto-update core
        run: npm run check:updater

      # The pure application menu tree.
      - name: Application menu
        run: npm run check:menu-app

      # Reopening where the user stopped never crashes on a bad value.
      - name: Resume last view
        run: npm run check:reprise

      # Mouse back/forward navigation history.
      - name: Navigation history
        run: npm run check:historique-nav

      # Language selection rules.
      - name: Language selection
        run: npm run check:langue

      # Time formatting.
      - name: Time format
        run: npm run check:format-heure

      # Wallpaper extensions and next-image cycle.
      - name: Wallpaper rules
        run: npm run check:fond

      - name: Build and package (AppImage)
        run: npm run pack:linux
        working-directory: apps/windows

      - name: Package config and contents
        run: npm run check:package

      - name: Check package artifact
        run: ls -lh dist-installer/*.AppImage
        working-directory: apps/windows

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: neo-quiz-linux-appimage
          path: apps/windows/dist-installer/*.AppImage
          if-no-files-found: error

  # Le paquet Windows construit DEUX exécutables : le NSIS reste le moteur
  # silencieux et le portable Electron devient la seule interface visible.
  # Les garder comme deux artefacts distincts permet d'éprouver le bootstrapper
  # avant de remplacer le lien public et la chaîne SignPath de la release.
  app-windows-package:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies (racine)
        run: npm ci

      - name: Install dependencies (apps/windows)
        run: npm ci
        working-directory: apps/windows

      - name: Code sandbox (Pyodide isolation)
        run: npm run check:code-sandbox

      # The Windows host implementation of src/host/types.ts.
      - name: Windows host contract
        run: npm run check:windows-host

      # CLI launching: name allow-list, quoting, process tree kill, per-tool lock.
      - name: Electron process launching
        run: npm run check:electron-process

      # Main-process file primitives on a real temp folder.
      - name: Electron file primitives
        run: npm run check:electron-fs

      # Electron accounts handling.
      - name: Electron accounts
        run: npm run check:electron-comptes

      # Settings, declared vaults and the bridge security perimeter.
      - name: Electron settings and perimeter
        run: npm run check:electron-reglages

      # AI providers: catalogue from net, offline detection, CLI cache snapshot.
      - name: AI providers
        run: npm run check:ai-providers

      - name: Build and package (NSIS)
        run: npm run pack:win
        working-directory: apps/windows

      # Le pourcentage d'installation du bootstrapper compte les octets ecrits
      # contre cette taille : `check:package` l'exige dans `latest.yml`, ici
      # comme dans `release.yml`, sinon le controle rougirait sur chaque push.
      - name: Write installedSize into latest.yml
        run: node scripts/write-installed-size.mjs

      - name: Package config and contents
        run: npm run check:package

      - name: Build bootstrapper (portable Electron)
        run: npm run pack:installer
        working-directory: apps/windows

      - name: Upload NSIS engine
        uses: actions/upload-artifact@v4
        with:
          name: neo-quiz-windows-setup
          path: apps/windows/dist-installer/*.exe
          if-no-files-found: error

      - name: Upload installer bootstrapper
        uses: actions/upload-artifact@v4
        with:
          name: neo-quiz-windows-installer
          path: apps/windows/dist-installer-bootstrapper/NeoQuiz-*.exe
          if-no-files-found: error
