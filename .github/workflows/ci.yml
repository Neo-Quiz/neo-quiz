name: CI

on:
  push:
    branches:
      - '**'
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      # LE FORMAT LEARN / PRACTICE : un Practice sans explication, une
      # tranche Learn incomplète, un slice qui ne pointe nulle part — signalés.
      - name: Learn and Practice format
        run: npm run check:quiz-format

      # LE PROMPT DE CHAQUE MODE DÉCRIT CE QUE LE CONTRÔLE EXIGE : un champ tu
      # dans le prompt n'est jamais produit (explain, le 2026-09-23).
      - name: Learn and Practice prompts
        run: npm run check:prompt

      # UNE RÉPONSE NUMÉRIQUE TAPÉE DANS L'ÉDITEUR D'ÉQUATIONS arrive en LaTeX
      # (« 1{,}5 », « \frac{3}{4} ») : ramenée à un nombre, jamais juste à tort.
      - name: Numeric answers typed in LaTeX
        run: npm run check:numeric

      # UNE RÉPONSE COPIÉE D'UN SITE, dans tous ses états : fence, prose,
      # LaTeX, virgule oubliée, faux titres de section (Gemini, 2026-09-24).
      # LE COURS AU-DESSUS D'UNE QUESTION : caché avant la lecture et pendant
      # un rappel, ouvert au-dessus d'une « à expliquer avec tes mots ».
      - name: Passage above a question
        run: npm run check:passage

      - name: Web channel responses
        run: npm run check:web-channel

      # LE CLIQUET DE LA FRONTIÈRE D'HÔTE. Le contrat `src/host/types.ts` dit
      # que c'est ce contrôle, et non la discipline, qui tient la frontière :
      # tant qu'il n'était lancé qu'à la main, c'était encore la discipline.
      # Il coûte moins d'une seconde et ne lit que des fichiers du dépôt —
      # ni vault, ni chaîne Rust, ni Obsidian installé.
      - name: Host boundary ratchet
        run: npm run check:host

      # LE NOYAU DES VIDÉOS YouTube : la règle de la piste (manuelle dans la
      # langue de la vidéo, sinon automatique `-orig`, JAMAIS une piste
      # traduite) ne se voit dans aucun typecheck — la prendre, c'est joindre
      # au prompt une transcription qui n'est pas celle de la vidéo. Charge le
      # code réel et des fixtures yt-dlp réduites ; pur, lecture seule.
      - name: YouTube videos kernel
        run: npm run check:video

      # TROUVER ET LANCER YT-DLP CÔTÉ PRINCIPAL : la copie gérée avant le
      # PATH étendu, l'identifiant revalidé avant tout lancement, les
      # arguments des deux appels figés, l'arbre tué au délai, la
      # miniature jamais bloquante. Sur un faux yt-dlp de la fixture, dans
      # un dossier temporaire — de vrais process, rien d'installé.
      - name: yt-dlp main process
        run: npm run check:electron-video

      # Le contenu d'un dossier (documents, notes, `Liens.md`) et ce que
      # « Créer avec l'IA » joint depuis un dossier : pur, lecture seule.
      - name: Folder contents and links grammar
        run: npm run check:folder-contents

      # L'aperçu d'une note : un rendu par blocs qui n'écrit que ses propres
      # balises. Le premier cas est la sécurité — une note reçue ne s'exécute
      # jamais.
      - name: Markdown preview rendering
        run: npm run check:md-preview

      # Même nature : lecture seule sur `src/assets/css` et le thème de l'app.
      # Une variable CSS oubliée ne produit AUCUNE erreur, juste un texte
      # invisible — donc elle se mesure, elle ne se relit pas.
      - name: App theme completeness
        run: npm run check:theme

      # L'entrée d'une vue se TERMINE : `markViewEnter` n'attend que les
      # animations qui peuvent finir, et aucune animation d'entrée ne garde
      # ses propriétés après sa fin. Sans quoi le survol d'une carte saute au
      # lieu de glisser — et ça ne se voit qu'à la souris, jamais dans un
      # typecheck. Pur, lecture seule sur `src/`.
      - name: View enter terminates
        run: npm run check:view-enter

      # LE VIEWPORT D'UN QUIZ N'EST JAMAIS DÉFILABLE : un `overflow: hidden`
      # s'y faisait défiler par un focus et laissait une page blanche.
      - name: Quiz viewport is clipped
        run: npm run check:viewport-clip

      # Le bootstrapper lance l'installeur NSIS en silence : l'ordre des
      # arguments et la sélection du paquet ne peuvent donc pas être relus à
      # l'écran. Ce contrôle charge le noyau réellement appelé par l'installeur.
      - name: Installer bootstrapper invariants
        run: npm run check:installer

      # Le REFLET de l'installation, dont dépend qu'une mise à jour aboutisse :
      # des liens durs sur un vrai dossier temporaire. Le risque tenu n'est pas
      # qu'une fenêtre soit laide, c'est qu'un processus lancé depuis le dossier
      # d'installation EMPÊCHE NSIS de le renommer. Pur Node, lecture seule sur
      # le dépôt, comme les autres contrôles de ce job.
      - name: Update window mirror
        run: npm run check:fenetre-maj

      - name: Changelog
        run: npm run check:changelog

      # Mêmes étapes que release.yml, sans publication : une casse de build
      # (loader manquant, import cassé) se voit au push, pas au moment du tag.
      - name: Build
        run: npm run build

      - name: Check release artifacts
        run: |
          test -f dist/main.js
          test -f dist/styles.css
          ls -lh dist/

  # Le paquet Linux de l'application : AppImage exige un runner Linux, ce
  # que le poste de développement (Windows) ne peut pas fournir. Job séparé du
  # greffon : une casse ici ne bloque pas la publication du greffon Obsidian.
  #
  # DEUX `npm ci`, DANS CET ORDRE (Ruling 22). Le code partagé qu'`apps/windows`
  # compile importe des paquets déclarés uniquement dans le `package.json` de
  # la RACINE (`mathlive`, `json5`) : un `npm ci` limité à `apps/windows`
  # laisse ces imports introuvables (125 erreurs `tsc` sans le premier
  # `npm ci`, 0 avec, mesuré dans un worktree sans `node_modules` racine).
  #
  # Plus de `continue-on-error` : il masquait un job qui n'a JAMAIS été vert
  # (chaque run échouait sur `executableName` dérivé de `@neo-quiz/windows`,
  # réparé par `executableName: "neo-quiz"` dans la config, tranche 6).
  app-linux-package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies (racine)
        run: npm ci

      - name: Install dependencies (apps/windows)
        run: npm ci
        working-directory: apps/windows

      # Le texte d'un PDF, par le VRAI moteur (`pdfjs-dist`, déclaré dans
      # `apps/windows`, d'où sa place APRÈS ce second `npm ci`). Les PDF sont
      # écrits par le script : ni fichier binaire au dépôt, ni vault.
      - name: PDF text extraction
        run: npm run check:pdf

      - name: Build and package (AppImage)
        run: npm run pack:linux
        working-directory: apps/windows

      - name: Package config and contents
        run: npm run check:package

      - name: Check package artifact
        run: ls -lh dist-installer/*.AppImage
        working-directory: apps/windows

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: neo-quiz-linux-appimage
          path: apps/windows/dist-installer/*.AppImage
          if-no-files-found: error

  # Le paquet Windows construit DEUX exécutables : le NSIS reste le moteur
  # silencieux et le portable Electron devient la seule interface visible.
  # Les garder comme deux artefacts distincts permet d'éprouver le bootstrapper
  # avant de remplacer le lien public et la chaîne SignPath de la release.
  app-windows-package:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies (racine)
        run: npm ci

      - name: Install dependencies (apps/windows)
        run: npm ci
        working-directory: apps/windows

      - name: Build and package (NSIS)
        run: npm run pack:win
        working-directory: apps/windows

      # Le pourcentage d'installation du bootstrapper compte les octets ecrits
      # contre cette taille : `check:package` l'exige dans `latest.yml`, ici
      # comme dans `release.yml`, sinon le controle rougirait sur chaque push.
      - name: Write installedSize into latest.yml
        run: node scripts/write-installed-size.mjs

      - name: Package config and contents
        run: npm run check:package

      - name: Build bootstrapper (portable Electron)
        run: npm run pack:installer
        working-directory: apps/windows

      - name: Upload NSIS engine
        uses: actions/upload-artifact@v4
        with:
          name: neo-quiz-windows-setup
          path: apps/windows/dist-installer/*.exe
          if-no-files-found: error

      - name: Upload installer bootstrapper
        uses: actions/upload-artifact@v4
        with:
          name: neo-quiz-windows-installer
          path: apps/windows/dist-installer-bootstrapper/NeoQuiz-*.exe
          if-no-files-found: error
